<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LicenseFlow Manager - Google Login</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; background: #0f172a; color: #e2e8f0;
    }
    .card { text-align: center; padding: 2rem; max-width: 440px; }
    button {
      background: #fff; color: #111; border: none; border-radius: 12px;
      padding: 14px 20px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .msg { margin-top: 1rem; font-size: 14px; line-height: 1.6; color: #94a3b8; white-space: pre-line; }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
  </style>
</head>
<body>
  <div class="card">
    <h1>LicenseFlow Manager</h1>
    <p class="msg">Google 로그인 (molnanle@gmail.com)</p>
    <button id="btn" type="button">Google로 로그인</button>
    <p id="status" class="msg">준비 중...</p>
  </div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
    import {
      getAuth,
      getRedirectResult,
      signInWithRedirect,
      signInWithPopup,
      GoogleAuthProvider,
      setPersistence,
      browserLocalPersistence,
    } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

    const statusEl = document.getElementById("status");
    const btn = document.getElementById("btn");
    const params = new URLSearchParams(window.location.search);
    const fromDesktop = params.get("from") === "desktop";
    const fromApp = params.get("from") === "app";
    const ADMIN_EMAIL = "molnanle@gmail.com";

    const setStatus = (text, cls = "") => {
      statusEl.textContent = text;
      statusEl.className = "msg " + cls;
    };

    const goToApp = () => {
      sessionStorage.removeItem("lfm_redirect_started");
      window.location.replace("/#/");
    };

    const isAdminUser = (user) => {
      const email = String(user?.email || "").trim().toLowerCase();
      return email === ADMIN_EMAIL && user?.emailVerified === true;
    };

    const sendHandoff = async (oauthIdToken, accessToken, email) => {
      const res = await fetch("/__auth/handoff", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          idToken: oauthIdToken,
          accessToken: accessToken || null,
          email: email || null,
        }),
      });
      if (!res.ok) throw new Error("관리 프로그램으로 로그인 정보를 전달하지 못했습니다.");
    };

    /** 같은 WebView(from=app)에서는 Firebase 세션이 이미 저장되므로 앱으로만 이동 */
    const enterAppFromSameOrigin = (user) => {
      btn.disabled = true;
      if (!isAdminUser(user)) {
        btn.disabled = false;
        setStatus(
          `관리자 계정(${ADMIN_EMAIL})으로 로그인해 주세요.\n현재: ${user?.email || "알 수 없음"}`,
          "err"
        );
        return false;
      }
      setStatus("로그인 완료! 프로그램으로 이동합니다...", "ok");
      goToApp();
      return true;
    };

    const finishLogin = async (user, credential) => {
      btn.disabled = true;

      // 프로그램 내부 로그인: 동일 origin 세션 공유 → handoff 불필요
      if (fromApp) {
        enterAppFromSameOrigin(user);
        return;
      }

      const oauthIdToken = credential?.idToken || null;
      const accessToken = credential?.accessToken || null;
      if (!oauthIdToken && !accessToken) {
        throw new Error("Google 인증 토큰을 받지 못했습니다. 아래 버튼으로 다시 로그인해 주세요.");
      }
      if (!isAdminUser(user)) {
        btn.disabled = false;
        setStatus(
          `관리자 계정(${ADMIN_EMAIL})으로 로그인해 주세요.\n현재: ${user?.email || "알 수 없음"}`,
          "err"
        );
        return;
      }

      setStatus("로그인 정보 전달 중...", "ok");
      await sendHandoff(oauthIdToken, accessToken, user.email);
      if (fromDesktop) {
        setStatus(
          "로그인 완료!\n이 창은 닫아도 됩니다.\n관리 프로그램으로 돌아가면 자동 연결됩니다.",
          "ok"
        );
        return;
      }
      setStatus("로그인 완료! 프로그램으로 이동합니다...", "ok");
      goToApp();
    };

    const finishFromResult = async (result) => {
      const cred = GoogleAuthProvider.credentialFromResult(result);
      await finishLogin(result.user, cred);
    };

    const cfg = await fetch("/firebase-applet-config.json").then((r) => {
      if (!r.ok) throw new Error("Firebase 설정을 불러오지 못했습니다.");
      return r.json();
    });
    const app = initializeApp(cfg);
    const auth = getAuth(app);

    // redirect 복귀 시 가장 먼저 처리
    let redirectResult = null;
    try {
      redirectResult = await getRedirectResult(auth);
    } catch (redirectErr) {
      console.warn("[login-helper] getRedirectResult:", redirectErr);
    }

    await setPersistence(auth, browserLocalPersistence);

    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ login_hint: ADMIN_EMAIL, prompt: "select_account" });

    const startGoogleLogin = async () => {
      btn.disabled = true;
      setStatus("Google 로그인 중...");

      // 프로그램 WebView 안 redirect는 Google 결과를 못 받음 → desktop 모드로 전환 안내
      if (fromApp) {
        btn.disabled = false;
        sessionStorage.removeItem("lfm_redirect_started");
        setStatus(
          "프로그램 창에서는 Google 로그인이 되지 않습니다.\n관리 프로그램에서 다시 'Firebase 로그인'을 누르면\n시스템 브라우저가 열립니다.",
          "err"
        );
        return;
      }

      // 외부 브라우저(레거시) — 팝업
      if (fromDesktop) {
        try {
          const popupResult = await signInWithPopup(auth, provider);
          await finishFromResult(popupResult);
          return;
        } catch (popupErr) {
          const code = popupErr?.code || "";
          if (code === "auth/popup-closed-by-user") {
            btn.disabled = false;
            setStatus("로그인 창이 닫혔습니다.\n아래 버튼을 눌러 다시 시도해 주세요.", "err");
            return;
          }
          throw popupErr;
        }
      }

      try {
        const popupResult = await signInWithPopup(auth, provider);
        await finishFromResult(popupResult);
        return;
      } catch (popupErr) {
        const code = popupErr?.code || "";
        if (code === "auth/popup-closed-by-user") {
          btn.disabled = false;
          setStatus("로그인 창이 닫혔습니다. 다시 시도해 주세요.", "err");
          return;
        }
        if (code !== "auth/popup-blocked") {
          throw popupErr;
        }
      }

      setStatus("Google 로그인 페이지로 이동합니다...");
      await signInWithRedirect(auth, provider);
    };

    const boot = async () => {
      try {
        // 1) Google redirect 복귀 — 성공 시 앱 진입 (같은 창이면 세션만으로 충분)
        if (redirectResult?.user) {
          setStatus("Google 로그인 결과 확인 중...");
          await finishFromResult(redirectResult);
          return;
        }

        await auth.authStateReady();

        // 2) 이미 로그인된 세션 — 절대 다시 Google로 보내지 않음 (무한 루프 방지)
        if (auth.currentUser) {
          if (fromApp) {
            enterAppFromSameOrigin(auth.currentUser);
            return;
          }
          if (fromDesktop) {
            // 외부 브라우저는 OAuth 토큰 handoff가 필요 → 수동 버튼으로 재로그인
            btn.disabled = false;
            setStatus(
              "세션은 있으나 토큰 전달이 필요합니다.\n아래 버튼으로 다시 로그인해 주세요."
            );
            return;
          }
          enterAppFromSameOrigin(auth.currentUser);
          return;
        }

        // 3) 미로그인
        if (fromApp) {
          btn.disabled = false;
          sessionStorage.removeItem("lfm_redirect_started");
          setStatus(
            "프로그램 창에서는 Google 로그인이 되지 않습니다.\n관리 프로그램 사이드바의\n'Firebase 관리자 로그인'을 다시 눌러 주세요.\n(시스템 브라우저가 열립니다)",
            "err"
          );
          return;
        }

        if (fromDesktop) {
          await startGoogleLogin();
          return;
        }

        btn.disabled = false;
        setStatus("아래 버튼을 눌러 Google 계정으로 로그인해 주세요.");
      } catch (e) {
        btn.disabled = false;
        sessionStorage.removeItem("lfm_redirect_started");
        const code = e?.code || "";
        const msg = e?.message || String(e);
        if (code === "auth/unauthorized-domain") {
          setStatus("Firebase 허용 도메인에 localhost 가 필요합니다.", "err");
        } else {
          setStatus("로그인 실패: " + msg, "err");
        }
      }
    };

    btn.addEventListener("click", () => {
      startGoogleLogin().catch((e) => {
        btn.disabled = false;
        sessionStorage.removeItem("lfm_redirect_started");
        setStatus("로그인 실패: " + (e?.message || e), "err");
      });
    });

    boot();
  </script>
</body>
</html>
